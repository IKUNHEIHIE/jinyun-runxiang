<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_product_clay_rabbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6F0"/>
      <stop offset="100%" stop-color="#FADBD8"/>
    </linearGradient>
    <filter id="shadow_product_clay_rabbit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景底色与宣纸纹理 -->
  <rect width="600" height="400" fill="url(#grad_product_clay_rabbit)"/>
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#E74C3C" stroke-width="0.75" opacity="0.4"/>

  <!-- 四角传统纹样回纹装饰 -->
  <g stroke="#E74C3C" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 28 45 L 28 28 L 45 28 M 34 40 L 34 34 L 40 34"/>
    <path d="M 572 45 L 572 28 L 555 28 M 566 40 L 566 34 L 560 34"/>
    <path d="M 28 355 L 28 372 L 45 372 M 34 360 L 34 366 L 40 366"/>
    <path d="M 572 355 L 572 372 L 555 372 M 566 360 L 566 366 L 560 366"/>
  </g>

  <!-- 艺术图形主体 -->
  <g transform="translate(300, 160)" filter="url(#shadow_product_clay_rabbit)">
    
<circle cx="0" cy="0" r="70" fill="#F57F17" opacity="0.08"/>
<!-- 礼盒托盘 -->
<rect x="-45" y="-20" width="90" height="65" rx="6" fill="#FFF8E1" stroke="#D6A85C" stroke-width="2"/>
<!-- 盒盖与丝带结 -->
<rect x="-50" y="-35" width="100" height="18" rx="4" fill="#8B4A2F"/>
<path d="M 0 -45 Q -15 -60 -5 -40 Q 0 -35 0 -35 Q 0 -35 5 -40 Q 15 -60 0 -45" fill="#D6A85C"/>
<line x1="0" y1="-35" x2="0" y2="45" stroke="#D6A85C" stroke-width="3"/>
<!-- 非遗铭牌 -->
<rect x="-24" y="2" width="48" height="22" rx="3" fill="#A8382B"/>
<text x="0" y="17" text-anchor="middle" font-size="10" fill="#FFF" font-weight="bold">非遗文创</text>

  </g>

  <!-- 顶部标签徽章 -->
  <g transform="translate(300, 55)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#E74C3C" opacity="0.15"/>
    <rect x="-78" y="-12" width="156" height="24" rx="12" fill="none" stroke="#E74C3C" stroke-width="1" opacity="0.6"/>
    <text text-anchor="middle" y="5" fill="#E74C3C" font-size="12" font-family="'Noto Serif SC', 'PingFang SC', serif" font-weight="600" letter-spacing="2">❖ 非遗工坊纯手作 ❖</text>
  </g>

  <!-- 底部标题与说明 -->
  <text x="300" y="315" text-anchor="middle" fill="#2C241E" font-size="22" font-weight="bold" font-family="'Noto Serif SC', 'SimSun', serif" letter-spacing="1">泥人张彩塑 · 吉祥兔儿爷非遗摆件</text>
  <text x="300" y="345" text-anchor="middle" fill="#786B61" font-size="13" font-family="'Noto Sans SC', sans-serif" letter-spacing="0.5">老艺人手工彩绘制作 · 收益定向捐助</text>

  <!-- 右下角朱砂印章 -->
  <g transform="translate(520, 320)">
    <rect x="0" y="0" width="34" height="34" rx="4" fill="#A8382B" opacity="0.9"/>
    <rect x="2" y="2" width="30" height="30" rx="3" fill="none" stroke="#FDE2DE" stroke-width="0.8"/>
    <text x="17" y="15" text-anchor="middle" fill="#FFF" font-size="9" font-family="serif" font-weight="bold">津韵</text>
    <text x="17" y="27" text-anchor="middle" fill="#FFF" font-size="9" font-family="serif" font-weight="bold">润乡</text>
  </g>
</svg>