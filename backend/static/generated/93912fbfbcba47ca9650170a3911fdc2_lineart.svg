<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 760" width="540" height="760">
  <rect width="100%" height="100%" fill="#F8F4EC" rx="16"/>
  <rect x="18" y="18" width="504" height="724" fill="none" stroke="none" stroke-width="2" stroke-dasharray="6,4" rx="12"/>

  <text x="270" y="48" font-size="19" font-family="'Noto Serif SC', serif" font-weight="bold" fill="#222" text-anchor="middle">津门非遗皮影戏 · 《津沽穆帅·红绫银枪影》</text>
  <text x="270" y="68" font-size="11" fill="#776D65" text-anchor="middle">帅盔靠旗红缨银枪巾帼武生 · 传统三签联动皮影</text>

  <g transform="translate(270, 390)">
    <line x1="0" y1="-140" x2="-150" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="-155" y="342" font-size="11" fill="#8C827A" font-family="monospace">领签(头枕)</text>
    <line x1="-120" y1="20" x2="-210" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="-215" y="342" font-size="11" fill="#8C827A" font-family="monospace">左手枪身签</text>
    <line x1="120" y1="-20" x2="180" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="175" y="342" font-size="11" fill="#8C827A" font-family="monospace">右手枪尾签</text>

    <!-- 四方靠旗 -->
    <path d="M-20,-40 L-130,-150 L-100,-175 L-10,-60 Z" fill="none" stroke="#111111" stroke-width="2.5"/>
    <line x1="-20" y1="-40" x2="-140" y2="-160" stroke="none" stroke-width="3"/>
    <path d="M20,-40 L130,-150 L100,-175 L10,-60 Z" fill="none" stroke="#111111" stroke-width="2.5"/>
    <line x1="20" y1="-40" x2="140" y2="-160" stroke="none" stroke-width="3"/>
    <path d="M-25,-10 L-150,-50 L-140,-85 L-15,-25 Z" fill="none" stroke="#111111" stroke-width="2.5"/>
    <path d="M25,-10 L150,-50 L140,-85 L15,-25 Z" fill="none" stroke="#111111" stroke-width="2.5"/>

    <!-- 腿部与战靴 -->
    <path d="M-50,150 Q-70,210 -55,265 L-20,265 Q-30,200 -10,150 Z" fill="none" stroke="#111111" stroke-width="3"/>
    <path d="M-65,260 L-15,260 Q-10,280 -45,280 L-65,280 Z" fill="none" stroke="#111111" stroke-width="2.5"/>
    <path d="M10,150 Q30,200 20,265 L55,265 Q70,210 50,150 Z" fill="none" stroke="#111111" stroke-width="3"/>
    <path d="M15,260 L65,260 Q70,280 35,280 L15,280 Z" fill="none" stroke="#111111" stroke-width="2.5"/>

    <!-- 战裙与连环铠甲 -->
    <path d="M-60,75 L60,75 L70,155 Q0,175 -70,155 Z" fill="none" stroke="#111111" stroke-width="3"/>
    <path d="M-55,-50 L55,-50 L65,75 L-65,75 Z" fill="none" stroke="#111111" stroke-width="3.5"/>
    <circle cx="0" cy="10" r="18" fill="#FFF" stroke="none" stroke-width="3"/>

    <!-- 红缨银枪 -->
    <line x1="-160" y1="-80" x2="150" y2="180" stroke="#B0BEC5" stroke-width="7" stroke-linecap="round"/>
    <polygon points="-160,-80 -185,-105 -170,-115 -145,-90" fill="none" stroke="#111111" stroke-width="2"/>
    <path d="M-150,-70 Q-165,-50 -140,-40 Q-130,-55 -140,-75 Z" fill="none" stroke="#111111" stroke-width="2"/>

    <circle cx="-105" cy="-25" r="7" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="85" cy="115" r="7" fill="none" stroke="#111111" stroke-width="2"/>

    <!-- 帅盔红缨 -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#111111" stroke-width="2"/>
      <path d="M-25,-25 L-20,-70 L0,-85 L20,-70 L25,-25 Z" fill="none" stroke="#111111" stroke-width="2.5"/>
      <path d="M0,-85 Q-20,-125 -40,-135 Q-15,-110 0,-90 Z" fill="none" stroke="#111111" stroke-width="2"/>
      <ellipse cx="6" cy="-40" rx="15" ry="14" fill="none" stroke="#111111" stroke-width="2.5"/>
      <path d="M10,-42 Q18,-45 20,-39" stroke="#111111" stroke-width="2" fill="none"/>
      <path d="M12,-30 Q18,-30 16,-26" stroke="none" stroke-width="2" fill="none"/>
    </g>
  </g>

  <rect x="440" y="675" width="48" height="48" fill="#888" rx="6"/>
  <text x="464" y="698" font-size="14" fill="#FFF" font-weight="bold" font-family="serif" text-anchor="middle">破阵</text>
  <text x="464" y="714" font-size="14" fill="#FFF" font-weight="bold" font-family="serif" text-anchor="middle">武生</text>
</svg>