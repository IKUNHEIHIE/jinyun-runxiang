    <circle cx="35" cy="35" r="4" fill="none" stroke="#333" stroke-width="2"></circle>
  </g>

  <g transform="translate(200, 480)">
    <rect x="-140" y="-80" width="280" height="230" fill="#FDFBF7" stroke="#CCC" stroke-dasharray="4,4" rx="8"></rect>
    <text x="0" y="-60" font-size="12" fill="#8B4A2F" text-anchor="middle">【部件三：分段双臂与道具手】</text>
    <path d="M-60,-20 L-20,-10 L-10,0 L-50,0 Z" fill="none" stroke="#B64A44" stroke-width="2"></path>
