  <text x="400" y="65" font-size="20" font-family="serif" font-weight="bold" fill="#2F2925" text-anchor="middle">《津韵润乡》美育手工坊 · A4比例纸样参考【净角】</text>
  <text x="400" y="90" font-size="13" fill="#776D65" text-anchor="middle">非遗皮影戏教具 · 红色实线剪裁，小圆圈穿孔铆接，蓝色虚线折叠</text>

  <g transform="translate(150, 220)">
    <rect x="-100" y="-80" width="200" height="170" fill="#FDFBF7" stroke="#CCC" stroke-dasharray="4,4" rx="8"></rect>
    <text x="0" y="-60" font-size="12" fill="#8B4A2F" text-anchor="middle">【部件一：头部与冠帽】</text>
    <path d="M-20,-30 Q-40,-50 -30,-70 Q0,-80 20,-60 L15,-20 Z" fill="none" stroke="#B64A44" stroke-width="2"></path>
    <path d="M-10,-20 L10,-20 Q12,-35 25,-40 L28,-48 Q20,-50 18,-55 Q28,-60 25,-70 L5,-70" fill="none" stroke="#B64A44" stroke-width="2"></path>
    <circle cx="0" cy="10" r="4" fill="none" stroke="#333" stroke-width="2"></circle>
    <text x="0" y="35" font-size="10" fill="#666" text-anchor="middle">○ 颈部领签穿孔</text>
  </g>

  <g transform="translate(480, 220)">
    <rect x="-160" y="-80" width="320" height="170" fill="#FDFBF7" stroke="#CCC" stroke-dasharray="4,4" rx="8"></rect>
    <text x="0" y="-60" font-size="12" fill="#8B4A2F" text-anchor="middle">【部件二：宽袍锦缎躯干】</text>
    <path d="M-45,-40 L45,-40 L55,40 L-55,40 Z" fill="none" stroke="#B64A44" stroke-width="2"></path>
