  <g transform="translate(560, 480)">
    <rect x="-150" y="-80" width="300" height="230" fill="#FDFBF7" stroke="#CCC" stroke-dasharray="4,4" rx="8"></rect>
    <text x="0" y="-60" font-size="12" fill="#8B4A2F" text-anchor="middle">【部件四：下袍双腿与云纹皂靴】</text>
    <path d="M-50,-20 L-20,-20 L-30,50 L-60,50 Z" fill="none" stroke="#B64A44" stroke-width="2"></path>
