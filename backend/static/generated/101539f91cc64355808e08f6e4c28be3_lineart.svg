<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 760" width="540" height="760">
  <defs>
    <radialGradient id="fcLeatherGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF8F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EADBCC" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="carpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#F8F4EC" rx="16"/>
  <rect x="18" y="18" width="504" height="724" fill="none" stroke="none" stroke-width="2" stroke-dasharray="6,4" rx="12"/>

  <text x="270" y="48" font-size="19" font-family="'Noto Serif SC', serif" font-weight="bold" fill="#222" text-anchor="middle">津门非遗皮影戏 · 津派皮影</text>
  <text x="270" y="68" font-size="11" fill="#776D65" text-anchor="middle">杨柳青吉庆福娃怀抱大红锦鲤 · 连年有余吉庆皮影</text>

  <g transform="translate(270, 390)">
    <line x1="0" y1="-130" x2="-150" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="-155" y="342" font-size="11" fill="#8C827A" font-family="monospace">领签(头枕)</text>
    <line x1="-120" y1="40" x2="-210" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="-215" y="342" font-size="11" fill="#8C827A" font-family="monospace">锦鲤操纵签</text>
    <line x1="110" y1="-30" x2="170" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="165" y="342" font-size="11" fill="#8C827A" font-family="monospace">荷叶莲花签</text>

    <path d="M-150,280 Q-100,240 -50,280 Q0,240 50,280 Q100,240 150,280" fill="none" stroke="#3498DB" stroke-width="2.5"/>
    <path d="M-130,295 Q-80,265 -30,295 Q20,265 70,295 Q120,265 160,295" fill="none" stroke="none" stroke-width="2"/>

    <!-- 胖娃娃短腿与红绳金铃铛 -->
    <g>
      <path d="M-45,150 Q-65,220 -40,260 L-10,260 Q-20,200 -5,150 Z" fill="none" stroke="#111111" stroke-width="3"/>
      <circle cx="-25" cy="255" r="6" fill="none" stroke="#111111" stroke-width="1.5"/>
      <path d="M5,150 Q20,200 10,260 L40,260 Q65,220 45,150 Z" fill="none" stroke="#111111" stroke-width="3"/>
      <circle cx="25" cy="255" r="6" fill="none" stroke="#111111" stroke-width="1.5"/>
    </g>

    <!-- 莲花与荷叶配件 -->
    <g transform="translate(90, -40)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#111111" stroke-width="2.5"/>
      <path d="M0,0 L-30,-25 M0,0 L30,-25 M0,0 L-35,15 M0,0 L35,15 M0,0 L0,38" stroke="none" stroke-width="1.5"/>
      <path d="M-15,-20 C-30,-60 -5,-75 0,-85 C5,-75 30,-60 15,-20 Z" fill="none" stroke="#111111" stroke-width="2"/>
      <path d="M-5,-20 C-15,-50 0,-65 0,-70 C0,-65 15,-50 5,-20 Z" fill="#FFF" stroke="#111111" stroke-width="1.5"/>
      <circle cx="0" cy="-35" r="4" fill="none"/>
      <line x1="0" y1="0" x2="30" y2="160" stroke="none" stroke-width="4"/>
    </g>

    <!-- 躯干：圆润红肚兜与长命百岁金锁 -->
    <g>
      <polygon points="0,-40 45,-15 50,140 -50,140 -45,-15" fill="none" stroke="#111111" stroke-width="3.5"/>
      <path d="M-25,-55 Q0,-45 25,-55" fill="none" stroke="none" stroke-width="3"/>
      <circle cx="0" cy="50" r="28" fill="none" stroke="none" stroke-width="3"/>
      <circle cx="0" cy="50" r="18" fill="none" stroke="none" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="0" y="56" font-size="18" fill="none" font-family="serif" font-weight="bold" text-anchor="middle">吉</text>
      <!-- 金锁 -->
      <path d="M-22,-25 Q0,-32 22,-25 Q15,-10 0,-12 Q-15,-10 -22,-25 Z" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="-12" cy="-10" r="2.5" fill="none"/>
      <circle cx="0" cy="-8" r="2.5" fill="none"/>
      <circle cx="12" cy="-10" r="2.5" fill="none"/>
    </g>

    <!-- ★★★ 核心资产：天津杨柳青招牌大红锦鲤 ★★★ -->
    <g transform="translate(-15, 45) rotate(-15)">
      <path d="M-105,10 C-80,-40 40,-50 110,0 C125,25 90,65 20,65 C-50,65 -95,45 -105,10 Z" fill="url(#carpGrad)" stroke="#111111" stroke-width="3.5"/>
      <path d="M105,5 Q155,-25 175,-5 Q145,25 165,55 Q135,35 100,20 Z" fill="none" stroke="#111111" stroke-width="2.5"/>
      <path d="M-30,-35 Q-15,-65 15,-40 Z" fill="none" stroke="#111111" stroke-width="2"/>
      <path d="M-40,45 Q-20,75 10,50 Z" fill="none" stroke="#111111" stroke-width="2"/>
      <path d="M-40,-10 Q-25,5 -10,-10 Q5,5 20,-10 Q35,5 50,-10" fill="none" stroke="none" stroke-width="2"/>
      <path d="M-30,15 Q-15,30 0,15 Q15,30 30,15 Q45,30 60,15" fill="none" stroke="none" stroke-width="2"/>
      <circle cx="-85" cy="5" r="7" fill="#FFF" stroke="#111111" stroke-width="2"/>
      <circle cx="-87" cy="5" r="3.5" fill="#000"/>
      <path d="M-98,12 Q-125,20 -115,35" fill="none" stroke="none" stroke-width="2.5"/>
    </g>

    <!-- 福娃双臂紧抱大红鲤鱼 -->
    <g>
      <path d="M-40,-30 Q-95,0 -70,55 Q-50,45 -35,0 Z" fill="none" stroke="#111111" stroke-width="3"/>
      <circle cx="-65" cy="55" r="10" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="-65" cy="45" r="4" fill="none"/>
      <path d="M40,-30 Q85,15 50,65 Q35,50 30,0 Z" fill="none" stroke="#111111" stroke-width="3"/>
      <circle cx="45" cy="65" r="10" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="45" cy="55" r="4" fill="none"/>
    </g>

    <!-- 福娃头部：双抓髻、红头绳、圆润胖脸 -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="-32" cy="-60" r="16" fill="none" stroke="#111111" stroke-width="3"/>
      <path d="M-40,-50 Q-55,-40 -45,-25" fill="none" stroke="none" stroke-width="3"/>
      <circle cx="32" cy="-60" r="16" fill="none" stroke="#111111" stroke-width="3"/>
      <path d="M40,-50 Q55,-40 45,-25" fill="none" stroke="none" stroke-width="3"/>
      <ellipse cx="0" cy="-35" rx="28" ry="24" fill="none" stroke="#111111" stroke-width="3"/>
      <circle cx="0" cy="-45" r="3.5" fill="none"/>
      <path d="M8,-36 Q16,-40 20,-34" fill="none" stroke="#111111" stroke-width="2.5"/>
      <path d="M12,-24 Q18,-18 20,-24" fill="none" stroke="#111111" stroke-width="1.5"/>
      <ellipse cx="14" cy="-28" rx="6" ry="4" fill="none" opacity="0.4"/>
    </g>
  </g>

  <rect x="440" y="675" width="48" height="48" fill="#888" rx="6"/>
  <text x="464" y="698" font-size="14" fill="#FFF" font-weight="bold" font-family="serif" text-anchor="middle">吉庆</text>
  <text x="464" y="714" font-size="14" fill="#FFF" font-weight="bold" font-family="serif" text-anchor="middle">福娃</text>
</svg>