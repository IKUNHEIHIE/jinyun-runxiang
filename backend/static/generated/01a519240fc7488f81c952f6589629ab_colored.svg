<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 760" width="540" height="760">
  <defs>
    <radialGradient id="mkLeatherGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF4E8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E5D6C1" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="featherGradL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="featherGradR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="75%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
  </defs>

  <!-- 透光宣纸与皮影亮子背景 -->
  <rect width="100%" height="100%" fill="#F8F4EC" rx="16"/>
  <rect x="18" y="18" width="504" height="724" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="6,4" rx="12"/>

  <!-- 顶部题字与非遗认证 -->
  <text x="270" y="48" font-size="19" font-family="'Noto Serif SC', serif" font-weight="bold" fill="#FF0000" text-anchor="middle">津门非遗皮影戏 · 《齐天大圣大闹天宫》津派皮影（三签活动翎款）</text>
  <text x="270" y="68" font-size="11" fill="#776D65" text-anchor="middle">齐天大圣三签活动翎毛可动皮影 · 镂空雕镞与矿物套色</text>

  <g transform="translate(270, 390)">
    <!-- 操纵三签与活动轴心标注 (领签、左右两手签) -->
    <line x1="0" y1="-140" x2="-160" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="-165" y="342" font-size="11" fill="#8C827A" font-family="monospace">领签(头枕)</text>
    <line x1="-120" y1="20" x2="-210" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="-215" y="342" font-size="11" fill="#8C827A" font-family="monospace">左手签</text>
    <line x1="120" y1="-30" x2="180" y2="330" stroke="#8C827A" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="175" y="342" font-size="11" fill="#8C827A" font-family="monospace">右手擎棒签</text>

    <!-- 脚底腾云驾雾祥云 -->
    <path d="M-140,285 Q-100,260 -70,285 Q-30,260 0,285 Q40,260 80,285 Q120,260 150,285" fill="none" stroke="#FFD700" stroke-width="3"/>
    <circle cx="-60" cy="275" r="10" fill="none" stroke="#FFD700" stroke-width="2"/>
    <circle cx="70" cy="275" r="10" fill="none" stroke="#FFD700" stroke-width="2"/>

    <!-- 腿部与登云战靴 -->
    <g>
      <!-- 左腿铠甲与战靴 -->
      <path d="M-55,160 Q-80,220 -60,270 L-25,270 Q-35,210 -15,160 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3"/>
      <path d="M-65,265 L-20,265 Q-15,282 -45,282 L-65,282 Z" fill="#8B4513" stroke="#2F2925" stroke-width="2.5"/>
      <path d="M-55,272 L-30,272" stroke="#FFD700" stroke-width="2"/>
      
      <!-- 右腿铠甲与战靴 (跨步动态) -->
      <path d="M15,160 Q35,210 25,270 L65,270 Q80,220 55,160 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3"/>
      <path d="M20,265 L70,265 Q75,282 45,282 L20,282 Z" fill="#8B4513" stroke="#2F2925" stroke-width="2.5"/>
      <path d="M30,272 L55,272" stroke="#FFD700" stroke-width="2"/>
    </g>

    <!-- 虎皮战裙 (带斑斓虎纹刻花) -->
    <g>
      <path d="M-65,85 L65,85 L75,165 Q0,185 -75,165 Z" fill="#E67E22" stroke="#2F2925" stroke-width="3.5"/>
      <!-- 镂空黑色虎皮斑纹 -->
      <polygon points="-55,95 -25,105 -55,115" fill="#8B4513" stroke="#2F2925" stroke-width="1"/>
      <polygon points="55,95 25,105 55,115" fill="#8B4513" stroke="#2F2925" stroke-width="1"/>
      <polygon points="-60,135 -20,145 -55,155" fill="#8B4513" stroke="#2F2925" stroke-width="1"/>
      <polygon points="60,135 20,145 55,155" fill="#8B4513" stroke="#2F2925" stroke-width="1"/>
      <polygon points="-15,115 0,140 15,115" fill="#8B4513" stroke="#2F2925" stroke-width="1"/>
      <!-- 战袍下摆红绸飞扬 -->
      <path d="M-75,120 Q-120,160 -100,195 Q-85,165 -65,150 Z" fill="#FF0000" stroke="#2F2925" stroke-width="2.5"/>
      <path d="M75,120 Q120,160 100,195 Q85,165 65,150 Z" fill="#FF0000" stroke="#2F2925" stroke-width="2.5"/>
    </g>

    <!-- 躯干：锁子黄金甲与护心镜 -->
    <g>
      <path d="M-55,-60 L55,-60 L68,85 L-68,85 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3.5"/>
      <path d="M-40,-35 Q-20,-20 0,-35 Q20,-20 40,-35" fill="none" stroke="#2F2925" stroke-width="2"/>
      <path d="M-45,-10 Q-20,5 0,-10 Q20,5 45,-10" fill="none" stroke="#2F2925" stroke-width="2"/>
      <path d="M-40,15 Q-20,30 0,15 Q20,30 40,15" fill="none" stroke="#2F2925" stroke-width="2"/>
      <path d="M-45,40 Q-20,55 0,40 Q20,55 45,40" fill="none" stroke="#2F2925" stroke-width="2"/>
      <circle cx="0" cy="15" r="22" fill="#FF0000" stroke="#FFD700" stroke-width="3"/>
      <circle cx="0" cy="15" r="14" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <circle cx="0" cy="15" r="5" fill="#FFF"/>
      <rect x="-55" y="68" width="110" height="18" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <circle cx="0" cy="77" r="6" fill="#FF0000" stroke="#2F2925" stroke-width="1.5"/>
    </g>

    <!-- 如意金箍棒 (横贯战局，两头金箍，中间朱红) -->
    <g>
      <line x1="-165" y1="130" x2="165" y2="-90" stroke="#C0392B" stroke-width="10" stroke-linecap="round"/>
      <line x1="-165" y1="130" x2="165" y2="-90" stroke="#FFF" stroke-width="2" stroke-dasharray="8,6" opacity="0.7"/>
      <!-- 金箍端头 1 (右上) -->
      <line x1="125" y1="-63" x2="165" y2="-90" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
      <circle cx="165" cy="-90" r="7" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <text x="110" y="-85" font-size="9" fill="#FF0000" font-weight="bold" font-family="serif">如意金箍棒</text>
      <!-- 金箍端头 2 (左下) -->
      <line x1="-125" y1="103" x2="-165" y2="130" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-165" cy="130" r="7" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
    </g>

    <!-- 左臂与护肩 -->
    <g>
      <path d="M-55,-60 C-85,-75 -95,-45 -80,-30 Z" fill="#FF0000" stroke="#2F2925" stroke-width="3"/>
      <path d="M-50,-50 L-95,-15 L-80,0 L-45,-35 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3"/>
      <circle cx="-88" cy="-8" r="5" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <path d="M-88,-8 L-125,25 L-110,35 L-78,5 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3"/>
      <circle cx="-120" cy="28" r="8" fill="#FBF4E8" stroke="#2F2925" stroke-width="2"/>
      <circle cx="-120" cy="28" r="3" fill="#FFD700"/>
    </g>

    <!-- 右臂举棒与护肩 -->
    <g>
      <path d="M55,-60 C85,-75 95,-45 80,-30 Z" fill="#FF0000" stroke="#2F2925" stroke-width="3"/>
      <path d="M50,-50 L95,-60 L105,-45 L55,-35 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3"/>
      <circle cx="100" cy="-52" r="5" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <path d="M100,-52 L125,-25 L115,-15 L90,-40 Z" fill="#FFD700" stroke="#2F2925" stroke-width="3"/>
      <circle cx="120" cy="-20" r="8" fill="#FBF4E8" stroke="#2F2925" stroke-width="2"/>
      <circle cx="120" cy="-20" r="3" fill="#FFD700"/>
    </g>

    <!-- 头部：凤翅紫金冠 + 双根活动翎毛 + 紧箍 + 火眼金睛猴脸 -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="6" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>

      <!-- ★★★ 双根超长高耸活动翎毛 (雉尾) ★★★ -->
      <path d="M-8,-55 C-35,-130 -115,-205 -175,-165 C-130,-145 -65,-95 -2,-55 Z" fill="url(#featherGradL)" stroke="#2F2925" stroke-width="2.5"/>
      <path d="M-45,-120 L-60,-135 M-78,-145 L-100,-165 M-115,-160 L-138,-182 M-145,-162 L-170,-175" stroke="#FFD700" stroke-width="2.5"/>
      <circle cx="-175" cy="-165" r="7" fill="#FF0000" stroke="#2F2925" stroke-width="1.5"/>
      <circle cx="-175" cy="-165" r="3" fill="#FFD700"/>

      <path d="M8,-55 C35,-140 120,-215 185,-175 C140,-155 70,-100 2,-55 Z" fill="url(#featherGradR)" stroke="#2F2925" stroke-width="2.5"/>
      <path d="M45,-125 L60,-140 M80,-152 L105,-172 M120,-168 L145,-190 M150,-172 L180,-185" stroke="#FFD700" stroke-width="2.5"/>
      <circle cx="185" cy="-175" r="7" fill="#FF0000" stroke="#2F2925" stroke-width="1.5"/>
      <circle cx="185" cy="-175" r="3" fill="#FFD700"/>

      <!-- 凤翅紫金冠冠体 -->
      <path d="M-26,-48 L-35,-85 L-15,-65 L0,-90 L15,-65 L35,-85 L26,-48 Z" fill="#FFD700" stroke="#2F2925" stroke-width="2.5"/>
      <circle cx="0" cy="-70" r="5" fill="#FF0000" stroke="#2F2925" stroke-width="1.5"/>
      <path d="M-30,-60 Q-60,-80 -45,-100 Q-30,-80 -25,-65 Z" fill="#FF0000" stroke="#2F2925" stroke-width="2"/>
      <path d="M30,-60 Q60,-80 45,-100 Q30,-80 25,-65 Z" fill="#FF0000" stroke="#2F2925" stroke-width="2"/>

      <!-- 金箍圈 -->
      <path d="M-22,-44 Q0,-52 22,-44 Q0,-38 -22,-44 Z" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <circle cx="0" cy="-46" r="4.5" fill="#FFD700" stroke="#2F2925" stroke-width="1.5"/>
      <circle cx="0" cy="-46" r="2" fill="#FF0000"/>

      <!-- 美猴王桃形侧脸脸谱 -->
      <path d="M-15,-40 C-25,-25 -10,-10 5,-15 C18,-18 25,-30 20,-42 Z" fill="#B63E2C" stroke="#2F2925" stroke-width="2.5"/>
      <ellipse cx="6" cy="-28" rx="8" ry="6" fill="#FBF4E8" stroke="#2F2925" stroke-width="1.5"/>
      <!-- 火眼金睛 -->
      <ellipse cx="8" cy="-30" rx="4.5" ry="3" fill="#FFD700" stroke="#2F2925" stroke-width="1.5"/>
      <circle cx="9" cy="-30" r="1.8" fill="#000"/>
      <path d="M12,-20 Q22,-20 20,-14 Q12,-12 8,-16" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
      <circle cx="16" cy="-17" r="1.5" fill="#2F2925"/>
      <path d="M-20,-35 Q-35,-20 -28,10 Q-20,-10 -15,-25 Z" fill="#FFD700" stroke="#2F2925" stroke-width="2"/>
    </g>
  </g>

  <!-- 底部红印章 -->
  <rect x="440" y="675" width="48" height="48" fill="#FF0000" rx="6"/>
  <text x="464" y="698" font-size="14" fill="#FFF" font-weight="bold" font-family="serif" text-anchor="middle">齐天</text>
  <text x="464" y="714" font-size="14" fill="#FFF" font-weight="bold" font-family="serif" text-anchor="middle">大圣</text>
</svg>