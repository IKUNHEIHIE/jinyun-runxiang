version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jinyun_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jinyun_runxiang
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema_all.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/migrations/V17__course_design_badges.sql:/docker-entrypoint-initdb.d/02_badge_catalog.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.0-alpine
    container_name: jinyun_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: jinyun_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  emqx:
    image: emqx/emqx:5.3.0
    container_name: jinyun_emqx
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_NAME: jinyun_broker
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqx_data:/opt/emqx/data

  backend:
    build: .
    container_name: jinyun_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DB: jinyun_runxiang
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./static:/app/static
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
  redis_data:
  minio_data:
  emqx_data:
