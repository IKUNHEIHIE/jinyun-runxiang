version: '3.8'

services:
  # ========================================================
  # 后端服务：FastAPI + SQLAlchemy + SQLite/MySQL + Uvicorn
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jinyun-backend
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      MYSQL_HOST: mysql
      MYSQL_USER: jinyun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DB: jinyun_runxiang
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/static:/app/static
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jinyun-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jinyun_runxiang
      MYSQL_USER: jinyun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema_all.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/migrations/V17__course_design_badges.sql:/docker-entrypoint-initdb.d/02_badge_catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - jinyun-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - jinyun-net

  # ========================================================
  # 管理后台前端：Vue 3 + PureAdmin + Element Plus + ECharts
  # ========================================================
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: jinyun-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - jinyun-net

  # ========================================================
  # 用户前台门户：Vue 3 + Vite + Element Plus + 非遗国潮设计
  # ========================================================
  user-web:
    build:
      context: ./user-web
      dockerfile: Dockerfile
    container_name: jinyun-user-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - jinyun-net

  # ========================================================
  # 统一入口反向代理：Nginx
  # ========================================================
  nginx:
    image: nginx:stable-alpine
    container_name: jinyun-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin-web
      - user-web
    networks:
      - jinyun-net

networks:
  jinyun-net:
    driver: bridge

volumes:
  mysql_data:
